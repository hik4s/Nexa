name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + build + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: nexa_finance_ci
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      POSTGRES_DB: nexa_finance_ci
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_ci_password
      POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Run database migrations
        working-directory: backend
        run: ./gradlew migrateDatabase

      - name: Test
        working-directory: backend
        run: ./gradlew clean test

      - name: Build
        working-directory: backend
        run: ./gradlew build

  android:
    name: Android tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Test Android unit tests
        working-directory: android
        run: ./gradlew clean :app:testDebugUnitTest

      - name: Lint Android
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
