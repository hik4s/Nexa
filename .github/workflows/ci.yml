name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + build + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: nexa_finance_ci
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      POSTGRES_DB: nexa_finance_ci
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_ci_password
      POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Run database migrations
        working-directory: backend
        run: ./gradlew migrateDatabase

      - name: Test
        working-directory: backend
        run: ./gradlew clean test

      - name: Build
        working-directory: backend
        run: ./gradlew build

  android:
    name: Android tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Test Android unit tests
        working-directory: android
        run: ./gradlew clean :app:testDebugUnitTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented Android tests + startup smoke metric
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          working-directory: ./android
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nexa.finance.sync.SyncConflictResolverInstrumentedTest --no-daemon

            package_name="com.nexa.finance"
            activity=".MainActivity"
            samples=""
            echo "Measuring cold startup with adb am start -S -W (5 samples)..."
            for i in 1 2 3 4 5; do
              adb shell am force-stop "$package_name"
              output="$(adb shell am start -S -W -n "$package_name/$activity")"
              total_time="$(printf "%s\n" "$output" | awk -F": " "\$1==\"TotalTime\" {print \$2; exit}")"
              case "$total_time" in
                ""|*[!0-9]*) echo "Invalid TotalTime on sample $i"; printf "%s\n" "$output"; exit 1 ;;
              esac
              echo "startup_sample_${i}_ms=${total_time}"
              samples="$samples $total_time"
            done

            median="$(printf "%s\n" $samples | sort -n | awk "{ values[NR]=\$1 } END { if (NR % 2 == 1) print values[(NR+1)/2]; else print values[NR/2] }")"
            average="$(printf "%s\n" $samples | awk "{sum += \$1} END {if (NR > 0) printf \"%.1f\", sum/NR}")"
            echo "NEXA_STARTUP_COLD_MS median_ms=${median} average_ms=${average} samples=${samples}"

      - name: Lint Android
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PnexaVersionCode=1 -PnexaVersionName=0.1.0

      - name: Build release AAB (unsigned)
        working-directory: android
        run: ./gradlew :app:bundleRelease -PnexaVersionCode=1 -PnexaVersionName=0.1.0

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexa-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error


  backup-worker:
    name: Backup worker validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate backup script syntax
        run: sh -n ops/postgres-backup/backup.sh

      - name: Build backup worker image
        run: docker build -f ops/postgres-backup/Dockerfile ops/postgres-backup
