name: NEXA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + build + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: nexa_finance_ci
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_finance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      POSTGRES_DB: nexa_finance_ci
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_ci_password
      POSTGRES_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Run database migrations
        id: migrate_database
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          ./gradlew migrateDatabase --stacktrace 2>&1 | tee /tmp/nexa-migrate.log

      - name: Surface migration failure details
        if: steps.migrate_database.outcome == 'failure'
        run: |
          echo '===== NEXA MIGRATION FAILURE ====='
          tail -n 300 /tmp/nexa-migrate.log || true
          echo '===== END NEXA MIGRATION FAILURE ====='
          exit 1

      - name: Test
        working-directory: backend
        run: ./gradlew clean test

      - name: Build
        working-directory: backend
        run: ./gradlew build

  android:
    name: Android tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Test Android unit tests
        working-directory: android
        run: ./gradlew clean :app:testDebugUnitTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          working-directory: ./android
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.nexa.finance.sync.SyncConflictResolverInstrumentedTest --no-daemon

      - name: Lint Android
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PnexaVersionCode=1 -PnexaVersionName=0.1.0

      - name: Build release AAB (unsigned)
        working-directory: android
        run: ./gradlew :app:bundleRelease -PnexaVersionCode=1 -PnexaVersionName=0.1.0

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexa-android-release-unsigned
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
